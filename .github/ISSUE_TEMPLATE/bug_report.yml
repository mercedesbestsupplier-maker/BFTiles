name: Bug report
description: Tell us what happened in BFTiles on Windows.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove account details and private window contents from screenshots or logs."
  - type: input
    id: version
    attributes:
      label: BFTiles version
      placeholder: "For example, 2.3.5"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and monitor setup
      placeholder: "For example, Windows 11, two monitors"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
